name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [crypto-ring, crypto-aws-lc-rs]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --lib --no-default-features --locked
      - run: cargo test --all-targets --no-default-features --features ${{ matrix.provider }},metrics --locked
      - run: cargo clippy --all-targets --no-default-features --features ${{ matrix.provider }},metrics --locked -- -D warnings
